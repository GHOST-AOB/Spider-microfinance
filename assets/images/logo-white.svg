<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="spiderGoldWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Emblem: Community Web & Prosperity Coin (White / Inverted) -->
  <g transform="translate(15, 10)">
    <!-- Outer Hexagon Web Rings -->
    <polygon points="35,5 65,22 65,58 35,75 5,58 5,22" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />
    <polygon points="35,13 58,26 58,54 35,67 12,54 12,26" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.6" />
    <polygon points="35,21 51,30 51,50 35,59 19,50 19,30" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.9" />
    
    <!-- Radiating Connecting Web Lines -->
    <line x1="35" y1="5" x2="35" y2="75" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
    <line x1="5" y1="22" x2="65" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
    <line x1="5" y1="58" x2="65" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" />
    
    <!-- Central Prosperity Coin Node -->
    <circle cx="35" cy="40" r="10" fill="url(#spiderGoldWhite)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="35" cy="40" r="6" fill="none" stroke="#17482D" stroke-width="1.5" stroke-opacity="0.9" />
    
    <!-- Community Network Nodes -->
    <circle cx="35" cy="13" r="3" fill="#F59E0B" />
    <circle cx="58" cy="26" r="3" fill="#FFFFFF" />
    <circle cx="58" cy="54" r="3" fill="#F59E0B" />
    <circle cx="35" cy="67" r="3" fill="#FFFFFF" />
    <circle cx="12" cy="54" r="3" fill="#F59E0B" />
    <circle cx="12" cy="26" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(95, 20)">
    <!-- Primary Brand Word -->
    <text x="0" y="27" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="1">SPIDER</text>
    <!-- Secondary Brand Word -->
    <text x="110" y="27" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="600" fill="#F59E0B" letter-spacing="2">MICROFINANCE</text>
    <!-- Tagline & Regulatory Trust -->
    <text x="2" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#D1D5DB" letter-spacing="0.8">WEAVING STRONGER COMMUNITIES • UGANDA</text>
  </g>
</svg>
