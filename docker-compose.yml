version: '3.8'

services:
  spider-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: spider-microfinance:latest
    container_name: spider_microfinance_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
